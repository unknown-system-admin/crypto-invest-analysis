services:
  - type: web
    name: crypto-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile.app
    repo: https://github.com/unknown-system-admin/crypto-invest-analysis
    branch: master
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8501"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
